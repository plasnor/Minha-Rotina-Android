
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.minharotina.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.minharotina.app'
        minSdk 24
        targetSdk 35
        versionCode 7
        versionName '7.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
