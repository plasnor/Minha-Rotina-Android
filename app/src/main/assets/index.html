</style></head><body><div class="shell"><aside class="side"><div class="brand">◉ Minha<span>Rotina</span></div><nav id="desktop"></nav></aside><main class="content"><div class="heading"><div><div class="eyebrow" id="subtitle">Seu espaço de organização</div><h1 id="title">Hoje</h1></div><div class="top-actions"><button class="special-top" onclick="specialEventForm()">★ Especial</button><button class="btn" onclick="page==='routines'?(routineDetail?editRoutine():createRoutineType()):edit()">+ Novo</button></div></div><div id="view"></div></main></div><nav class="bottom" id="mobile"></nav><div class="modal" id="modal" hidden><div class="dialog"><h2 id="modalTitle">Atividade</h2><div id="modalBody"></div></div></div><script>
const KEY='minhaRotinaV2', DAYS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'], NAV=[['today','◉','Hoje'],['week','▦','Semana'],['agenda','▤','Agenda'],['routines','◎','Rotinas'],['assistant','✧','Assistente'],['settings','⚙','Ajustes']];let page='today',filter='all',proposal=null,chat=[],routineTab='study',routineDetail=false;const pad=n=>String(n).padStart(2,'0'),dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,today=()=>dateKey(new Date()),plus=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return dateKey(x)},minutes=t=>Number(t.slice(0,2))*60+Number(t.slice(3,5)),clock=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`,safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function seed(){let a=[],id=0;function add(name,days,start,end,cat,priority=2,flex=false){a.push({id:++id,name,days,start,end,cat,priority,flex,reminder:15,completed:[],skipped:[]})}add('Café da manhã',[1,2,3,4,5,6],'06:45','07:10','food');add('Estudo individual',[1,2,3,4,5],'07:10','07:45','study',2,true);add('Trabalho',[1,2,3,4,5],'08:00','11:00','work',3);add('Jiu-jitsu',[1,2,3,4,5],'11:00','12:00','train',3);add('Almoço e banho',[1,2,3,4,5],'12:00','13:00','food');add('Trabalho',[1,2,3,4,5],'13:00','18:00','work',3);add('Lanche da tarde',[1,2,3,4,5],'16:00','16:10','food');add('Jantar e deslocamento',[1,2,3,5],'18:00','19:15','food');add('Faculdade',[1,2,3,5],'19:15','20:25','college',3);add('Intervalo da faculdade',[1,2,3,5],'20:25','20:45','food');add('Faculdade',[1,2,3,5],'20:45','22:15','college',3);add('Capoeira (quinta)',[4],'19:30','20:30','train',3);add('Jiu-jitsu (quinta à noite)',[4],'21:00','22:00','train',3);add('Trabalho (sábado)',[6],'08:00','16:00','work',3);add('Estudo (sábado, se possível)',[6],'17:00','18:00','study',2,true);add('Estudo aprofundado',[0],'09:30','11:00','study',2,true);add('Revisão semanal',[0],'17:00','17:30','study',2,true);return a}
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.events))state={events:seed(),defaultReminder:15};if(state.events.length&&state.events.every(e=>!e||typeof e.start!=='string'||typeof e.end!=='string')){try{localStorage.setItem('minhaRotinaBackupLegado',JSON.stringify(state))}catch{}state={events:seed(),defaultReminder:15}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}const DEFAULT_ROUTINE_TYPES=[['study','◈','Estudos','Organize matérias, revisões e metas.'],['train','◉','Treinos','Jiu-jitsu, capoeira, academia e recuperação.'],['hair','✳','Capilar','Cuidados, hidratação e cronograma.'],['diet','◒','Dieta','Refeições, hidratação e hábitos alimentares.'],['personal','✦','Pessoal','Hábitos, autocuidado e tarefas livres.']];

{id:102,cat:'train',name:'Jiu-jitsu',time:'11:00',days:[1,2,3,4,5],done:[]},

]};
if(!Array.isArray(routineState.types))routineState.types=DEFAULT_ROUTINE_TYPES.map(x=>[...x]);
const ROUTINE_TYPES=routineState.types;
if(!ROUTINE_TYPES.some(x=>x[0]===routineTab))routineTab=ROUTINE_TYPES[0][0];
function createRoutineType(){document.getElementById('modalTitle').textContent='Criar tipo de rotina';document.getElementById('modalBody').innerHTML=`<div class="field"><label>Nome da rotina</label><input id="typename" maxlength="35" placeholder="Ex.: Leitura, Finanças, Corrida"></div><div class="field"><label>Descrição</label><input id="typedesc" maxlength="100" placeholder="O que você quer acompanhar?"></div><div class="actions"><button class="btn" onclick="saveRoutineType()">Criar rotina</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`;document.getElementById('modal').hidden=false}
function saveRoutineType(){let name=document.getElementById('typename').value.trim(),desc=document.getElementById('typedesc').value.trim();if(!name)return alert('Informe o nome da rotina.');let id='custom_'+Date.now();ROUTINE_TYPES.push([id,'✦',name,desc||'Sua rotina personalizada.']);routineTab=id;routineDetail=true;saveRoutines();closeModal();render()}
function removeRoutineType(){if(!routineTab.startsWith('custom_'))return;let cat=ROUTINE_TYPES.find(x=>x[0]===routineTab);if(!confirm('Excluir a categoria '+cat[2]+' e todos os hábitos dela?'))return;routineState.types=routineState.types.filter(x=>x[0]!==routineTab);routineState.items=routineState.items.filter(x=>x.cat!==routineTab);routineTab='study';routineDetail=false;saveRoutines();render()}
function saveRoutines(){localStorage.setItem(ROUTINE_KEY,JSON.stringify(routineState))}
function routineItems(){return routineState.items.filter(x=>x.cat===routineTab).sort((a,b)=>a.time.localeCompare(b.time))}
function openRoutine(id){routineTab=id;routineDetail=true;render()}

if(!routineDetail){
 const all=ROUTINE_TYPES.map(cat=>{let items=routineState.items.filter(x=>x.cat===cat[0]),due=items.filter(x=>x.days.includes(wd)),done=due.filter(x=>(x.done||[]).includes(day)).length;return `<button class="routine-directory-row" onclick="openRoutine('${cat[0]}')"><span class="routine-directory-icon">${cat[1]}</span><span class="routine-directory-main"><strong>${safe(cat[2])}</strong><small>${items.length} atividade${items.length===1?'':'s'}${due.length?' · '+done+'/'+due.length+' hoje':''}</small></span><span class="routine-directory-chevron">›</span></button>`}).join('');
 el.innerHTML=`<section class="routine-directory-header"><div class="eyebrow">SEU ESPAÇO PESSOAL</div><h2>Suas rotinas<span>.</span></h2><p>Escolha uma área para ver e organizar suas atividades.</p></section><div class="routine-directory">${all}</div><button class="routine-create" onclick="createRoutineType()"><span>＋</span> Criar nova rotina</button><p class="routine-directory-foot">Cada rotina tem suas próprias atividades, horários e lembretes. Sua agenda geral continua na aba Hoje.</p>`;
 return;
}
const cat=ROUTINE_TYPES.find(x=>x[0]===routineTab)||ROUTINE_TYPES[0];if(!cat){routineDetail=false;return renderRoutines()}

el.innerHTML=`<button class="routine-back" onclick="backToRoutines()">‹ Todas as rotinas</button><section class="routine-detail-header"><div class="eyebrow">${cat[1]} SUA ROTINA</div><h2>${safe(cat[2])}<span>.</span></h2><p>${safe(cat[3])}</p></section><section class="routine-detail-today"><div class="eyebrow">HOJE</div><div class="routine-detail-count">${done}<span> / ${due.length}</span></div><p>atividades concluídas</p></section><div class="routine-detail-section"><h3>Minhas atividades</h3><button onclick="editRoutine()">＋ Adicionar</button></div><div class="routine-list">${items.map(x=>`<div class="routine-item"><button class="routine-check ${(x.done||[]).includes(day)?'checked':''}" title="Concluir hoje" onclick="toggleRoutine(${x.id})">${(x.done||[]).includes(day)?'✓':''}</button><div class="grow"><div class="name ${(x.done||[]).includes(day)?'struck':''}">${safe(x.name)}</div><div class="sub">${safe(x.time)} · ${x.days.length?x.days.map(d=>DAYS[d]).join(', '):'Sem dias definidos'}</div></div><button class="routine-more" onclick="editRoutine(${x.id})" aria-label="Editar ${safe(x.name)}">•••</button></div>`).join('')||'<p class="empty">Nenhuma atividade por aqui. Toque em Adicionar para começar.</p>'}</div>${routineTab.startsWith('custom_')?'<button class="routine-delete-type" onclick="removeRoutineType()">Excluir esta categoria</button>':''}`;
}
function toggleRoutine(id){let x=routineState.items.find(x=>x.id===id);if(!x)return;let d=today();x.done=x.done.includes(d)?x.done.filter(y=>y!==d):[...x.done,d];saveRoutines();render()}
function editRoutine(id){let x=routineState.items.find(x=>x.id===id)||{name:'',time:'08:00',days:[1,2,3,4,5],cat:routineTab,reminder:15};document.getElementById('modalTitle').textContent=id?'Editar hábito':'Novo hábito';document.getElementById('modalBody').innerHTML=`<div class="field"><label>Nome do hábito ou atividade</label><input id="rname" maxlength="100" value="${safe(x.name)}" placeholder="Ex.: Hidratação capilar"></div><div class="field"><label>Horário de referência</label><input id="rtime" type="time" value="${safe(x.time)}"></div><div class="field"><label>Repetir nos dias</label><div class="routine-days">${DAYS.map((d,i)=>`<label><input type="checkbox" class="rday" value="${i}" ${x.days.includes(i)?'checked':''}>${d}</label>`).join('')}</div></div><div class="field"><label>Avisar antes (minutos)</label><input id="rrem" type="number" min="0" max="1440" value="${x.reminder??15}"></div><p class="hint">Você pode deixar todos os dias desmarcados para usar como lista pessoal. Os alertas nativos funcionarão quando a integração Android estiver pronta.</p><div class="actions"><button class="btn" onclick="saveRoutine(${id||'null'})">Salvar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button>${id?`<button class="btn danger" onclick="deleteRoutine(${id})">Excluir</button>`:''}</div>`;document.getElementById('modal').hidden=false}
function saveRoutine(id){let name=document.getElementById('rname').value.trim(),time=document.getElementById('rtime').value,reminder=Number(document.getElementById('rrem').value)||0,days=[...document.querySelectorAll('.rday:checked')].map(x=>Number(x.value));if(!name||!time){alert('Informe o nome e o horário.');return}if(id){let x=routineState.items.find(x=>x.id===id);Object.assign(x,{name,time,days,reminder})}else routineState.items.push({id:Date.now(),cat:routineTab,name,time,days,reminder,done:[]});saveRoutines();closeModal();render()}
function deleteRoutine(id){if(!confirm('Excluir este hábito?'))return;routineState.items=routineState.items.filter(x=>x.id!==id);saveRoutines();closeModal();render()}
function occurrences(day){let wd=new Date(day+'T12:00:00').getDay();return state.events.filter(e=>e&&typeof e==='object'&&typeof e.start==='string'&&typeof e.end==='string'&&(e.date===day||(!e.date&&Array.isArray(e.days)&&e.days.includes(wd)))&&!(Array.isArray(e.skipped)&&e.skipped.includes(day))).map(e=>({...e,day,done:Array.isArray(e.completed)&&e.completed.includes(day)})).sort((a,b)=>String(a.start).localeCompare(String(b.start)))}function nav(){let html=NAV.map(([id,ico,label])=>`<button class="nav ${page===id?'active':''}" onclick="show('${id}')">${ico} &nbsp; ${label}</button>`).join('');document.getElementById('desktop').innerHTML=html;document.getElementById('mobile').innerHTML=[['today','⌂','Hoje'],['routines','◎','Rotinas'],['more','☷','Mais']].map(([id,ico,label])=>`<button class="${(id==='more'?!['today','routines'].includes(page):page===id)?'active':''}" onclick="${id==='more'?'openMore()':`show('${id}')`}"><b>${ico}</b>${label}</button>`).join('')}
function openMore(){
 document.getElementById('modalTitle').textContent='Mais opções';
 document.getElementById('modalBody').innerHTML=`<div class="more-list">${[['week','▦','Semana'],['agenda','▤','Agenda completa'],['assistant','✧','Assistente'],['settings','⚙','Ajustes']].map(([id,ico,label])=>`<button class="more-entry" onclick="closeModal();show('${id}')"><span>${ico}</span><strong>${label}</strong><em>›</em></button>`).join('')}<button class="more-entry more-special" onclick="closeModal();specialEventForm()"><span>★</span><strong>Evento especial</strong><em>›</em></button></div><button class="btn ghost" style="margin-top:18px;width:100%" onclick="closeModal()">Fechar</button>`;
 document.getElementById('modal').hidden=false;
}
function show(p){page=p;nav();document.getElementById('title').textContent=NAV.find(x=>x[0]===p)[2];document.getElementById('subtitle').textContent=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});try{render()}catch(err){console.error('Falha ao abrir aba',p,err);document.getElementById('view').innerHTML='<div style="padding:24px 0;color:#eee"><h2>Não foi possível carregar esta aba</h2><p>Seus dados foram mantidos. Tente atualizar a página.</p><button class="btn" onclick="location.reload()">Atualizar</button></div>'}}
function row(e){return `<div class="line ${e.done?'done':''}"><div class="time">${safe(e.start)}–${safe(e.end)}</div><span class="dot ${safe(e.cat)}"></span><div class="grow"><div class="name">${e.special?'★ ':''}${safe(e.name)}</div><div class="sub">${e.flex?'Flexível':'Fixo'} · ${['','Baixa','Média','Alta'][e.priority]||'Média'} prioridade</div></div><button class="iconbtn" title="${e.done?'Desfazer':'Concluir'}" onclick="toggle(${e.id},'${e.day}')">${e.done?'↶':'✓'}</button><button class="iconbtn" title="Editar" onclick="edit(${e.id})">⋯</button></div>`}function toggle(id,d){let e=state.events.find(x=>x.id===id);if(!e)return;e.completed??=[];e.completed=e.completed.includes(d)?e.completed.filter(x=>x!==d):[...e.completed,d];save();render()}
function renderLiveTimeline(events){
 const now=new Date(),m=now.getHours()*60+now.getMinutes(),time=clock(m);
 const items=events.slice().sort((a,b)=>minutes(a.start)-minutes(b.start));
 let marker=false,parts=[];
 for(const e of items){
  if(!marker&&minutes(e.start)>m){parts.push(`<div class="live-now"><span class="time">${time}</span><span class="now-pulse"></span><span class="now-label">AGORA</span></div>`);marker=true;}
  const status=m>=minutes(e.end)?'past':m>=minutes(e.start)?'current':'upcoming';
  parts.push(`<div class="timeline-status ${status}">${row(e)}</div>`);
 }
 if(!marker)parts.push(`<div class="live-now"><span class="time">${time}</span><span class="now-pulse"></span><span class="now-label">AGORA</span></div>`);
 return `<div class="live-timeline" aria-label="Linha do tempo atualizada conforme o horário">${parts.join('')}</div><div class="timeline-footnote">O marcador vermelho acompanha o horário do seu celular.</div>`;
}
function updateLiveTimeline(){if(page!=='today')return;const target=document.getElementById('liveTimeline');if(target)target.innerHTML=renderLiveTimeline(occurrences(today()));}
setInterval(updateLiveTimeline,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateLiveTimeline()});
function render(){let el=document.getElementById('view'),d=today(),ev=occurrences(d);if(page==='routines'){renderRoutines();return}if(page==='today'){let done=ev.filter(e=>e.done).length,study=ev.filter(e=>e.cat==='study').reduce((s,e)=>s+minutes(e.end)-minutes(e.start),0);el.innerHTML=`<section class="hero"><div class="kicker">SUA ROTINA, NO SEU RITMO</div><h2>Faça espaço para o que importa.</h2><p>Tudo o que você precisa fazer, sem ruído. Um dia mais leve começa aqui.</p><div class="herofoot"><span>◷ ${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</span><span>✓ ${done} concluídas</span></div></section><div class="grid"><div class="card"><div class="muted">Atividades hoje</div><div class="stat">${ev.length}</div></div><div class="card"><div class="muted">Concluídas</div><div class="stat">${done}/${ev.length}</div><div class="progress"><div style="width:${ev.length?done/ev.length*100:0}%"></div></div></div><div class="card"><div class="muted">Estudo planejado</div><div class="stat">${study} <small>min</small></div></div></div><div class="card"><h2>Linha do tempo</h2><div id="liveTimeline">${renderLiveTimeline(ev)}</div></div><div class="card"><h2>Atividade não realizada?</h2><p>O assistente pode sugerir outro horário para tarefas flexíveis, sem alterar sua agenda antes da sua aprovação.</p><button class="btn ghost" onclick="show('assistant')">Abrir assistente ✧</button></div>`}
else if(page==='week'){let monday=plus(d,-((new Date(d+'T12:00:00').getDay()+6)%7));let days=Array.from({length:7},(_,i)=>plus(monday,i));let all=days.flatMap(occurrences),done=all.filter(x=>x.done).length,study=all.filter(x=>x.cat==='study').reduce((s,e)=>s+minutes(e.end)-minutes(e.start),0);el.innerHTML=`<div class="grid"><div class="card"><div class="muted">Eventos da semana</div><div class="stat">${all.length}</div></div><div class="card"><div class="muted">Concluídos</div><div class="stat">${done}</div></div><div class="card"><div class="muted">Estudo previsto</div><div class="stat">${(study/60).toFixed(1)}h</div></div></div><div class="week">${days.map(day=>`<div class="day"><div class="dayhead">${DAYS[new Date(day+'T12:00:00').getDay()]} · ${day.slice(8)}</div>${occurrences(day).map(e=>`<div class="mini ${safe(e.cat)}">${safe(e.start)} ${safe(e.name)}${e.done?' ✓':''}</div>`).join('')}</div>`).join('')}</div>`}
else if(page==='agenda'){let es=state.events.filter(e=>filter==='all'||e.cat===filter);el.innerHTML=`<div class="filters">${[['all','Todas'],['study','Estudos'],['train','Treinos'],['work','Trabalho'],['college','Faculdade'],['food','Refeições']].map(([id,label])=>`<button class="${filter===id?'selected':''}" onclick="filter='${id}';render()">${label}</button>`).join('')}</div><div class="card">${es.map(e=>`<div class="line"><span class="dot ${safe(e.cat)}"></span><div class="grow"><div class="name">${safe(e.name)}</div><div class="sub">${safe(e.start)}–${safe(e.end)} · ${e.date?safe(e.date):e.days.map(x=>DAYS[x]).join(', ')} · ${e.flex?'Flexível':'Fixo'}</div></div><button class="iconbtn" onclick="edit(${e.id})">Editar</button></div>`).join('')||'<p>Sem atividades nesta categoria.</p>'}</div>`}
else if(page==='assistant'){el.innerHTML=`<div class="card"><h2>Assistente de agenda ✧</h2><p>Comandos locais gratuitos. Não é a API do ChatGPT. Experimente: “marcar estudar amanhã às 15:00”, “o que tenho hoje?”, “não fiz estudo individual”.</p><div id="messages">${chat.map(m=>`<div class="bubble ${m.me?'me':''}">${safe(m.text)}</div>`).join('')}</div><div class="field"><label for="cmd">Seu pedido</label><textarea id="cmd" rows="3" placeholder="Ex.: marcar leitura amanhã às 16:00"></textarea></div><div class="actions"><button class="btn" onclick="command()">Enviar</button><button class="btn ghost" onclick="listen()">🎙 Falar</button></div><div id="suggestion"></div></div>`;if(proposal)showProposal()}
else if(page==='settings'){el.innerHTML=`<div class="card"><h2>Lembretes</h2><p>O navegador pode avisar enquanto o aplicativo estiver aberto. Notificações confiáveis com APK fechado ainda exigem integração nativa.</p><div class="field"><label>Antecedência padrão (minutos)</label><input id="rem" type="number" min="0" max="1440" value="${state.defaultReminder||15}"></div><button class="btn" onclick="state.defaultReminder=Number(document.getElementById('rem').value)||0;save();alert('Preferência salva')">Salvar</button><button class="btn ghost" onclick="Notification.requestPermission().then(x=>alert('Permissão: '+x))">Permitir notificações</button></div><div class="card"><h2>Seus dados</h2><p>As informações ficam neste navegador/dispositivo. Exporte um backup antes de trocar de celular ou reinstalar.</p><div class="actions"><button class="btn ghost" onclick="backup()">Exportar backup</button><button class="btn ghost" onclick="document.getElementById('import').click()">Importar backup</button><input type="file" id="import" accept="application/json" hidden onchange="restore(this)"></div></div>`}}

function specialEventForm(id){let e=state.events.find(x=>x.id===id)||{name:'',date:today(),start:'09:00',end:'10:00',reminder:1440,alerts:[1440,120,30,0],sound:true,vibrate:true};document.getElementById('modalTitle').textContent=id?'Editar evento importante':'Novo evento importante';document.getElementById('modalBody').innerHTML=`<div class="field"><label>Evento</label><input id="sname" maxlength="100" value="${safe(e.name)}" placeholder="Ex.: Prova final, consulta, viagem"></div><div class="two"><div class="field"><label>Data</label><input id="sdate" type="date" value="${safe(e.date||today())}"></div><div class="field"><label>Horário</label><input id="stime" type="time" value="${safe(e.start)}"></div></div><div class="field"><label>Alertas especiais</label><select id="salerts"><option value="1440,120,30,0">1 dia, 2 horas, 30 min e na hora</option><option value="10080,1440,60,0">1 semana, 1 dia, 1 hora e na hora</option><option value="1440,60,0">1 dia, 1 hora e na hora</option><option value="60,15,0">1 hora, 15 min e na hora</option></select></div><div class="field"><label><input id="ssound" type="checkbox" style="width:auto" ${e.sound!==false?'checked':''}> Solicitar som</label></div><div class="field"><label><input id="svibrate" type="checkbox" style="width:auto" ${e.vibrate!==false?'checked':''}> Solicitar vibração</label></div><p class="hint">Som, vibração e alertas com aplicativo fechado dependerão do APK Android e das permissões concedidas. No site, não são garantidos.</p><div class="actions"><button class="btn" onclick="saveSpecial(${id||'null'})">Salvar evento</button><button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`;document.getElementById('salerts').value=(e.alerts||[1440,120,30,0]).join(',');document.getElementById('modal').hidden=false}
function saveSpecial(id){let name=document.getElementById('sname').value.trim(),date=document.getElementById('sdate').value,time=document.getElementById('stime').value;if(!name||!date||!time)return alert('Preencha nome, data e horário.');let end=clock(Math.min(minutes(time)+30,1439));let old=state.events.find(x=>x.id===id);let e={id:id||Date.now(),name,date,start:time,end,days:[],cat:'other',priority:3,flex:false,special:true,alerts:document.getElementById('salerts').value.split(',').map(Number),sound:document.getElementById('ssound').checked,vibrate:document.getElementById('svibrate').checked,reminder:0,completed:old?.completed||[],skipped:old?.skipped||[]};if(id)state.events=state.events.map(x=>x.id===id?e:x);else state.events.push(e);save();closeModal();render()}
function edit(id){if(id&&state.events.find(x=>x.id===id)?.special){specialEventForm(id);return}let e=state.events.find(x=>x.id===id)||{name:'',start:'15:00',end:'16:00',cat:'study',priority:2,flex:true,days:[],reminder:state.defaultReminder};document.getElementById('modalTitle').textContent=id?'Editar atividade':'Nova atividade';document.getElementById('modalBody').innerHTML=`<div class="field"><label>Nome</label><input id="ename" value="${safe(e.name)}"></div><div class="two"><div class="field"><label>Início</label><input id="start" type="time" value="${e.start}"></div><div class="field"><label>Fim</label><input id="end" type="time" value="${e.end}"></div></div><div class="field"><label>Data (deixe vazia para repetir semanalmente)</label><input id="edate" type="date" value="${e.date||''}"></div><div class="field"><label>Dias da semana (se recorrente)</label><div>${DAYS.map((d,i)=>`<label style="display:inline-block;margin:5px"><input style="width:auto" type="checkbox" class="weekday" value="${i}" ${e.days?.includes(i)?'checked':''}>${d}</label>`).join('')}</div></div><div class="two"><div class="field"><label>Categoria</label><select id="cat">${[['study','Estudo'],['train','Treino'],['work','Trabalho'],['college','Faculdade'],['food','Refeição'],['other','Outros']].map(([v,l])=>`<option value="${v}" ${e.cat===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>Prioridade</label><select id="priority">${[['1','Baixa'],['2','Média'],['3','Alta']].map(([v,l])=>`<option value="${v}" ${e.priority==v?'selected':''}>${l}</option>`).join('')}</select></div></div><div class="two"><div class="field"><label>Flexível?</label><select id="flex"><option value="yes" ${e.flex?'selected':''}>Sim</option><option value="no" ${!e.flex?'selected':''}>Não</option></select></div><div class="field"><label>Lembrete (min)</label><input id="eventrem" type="number" min="0" max="1440" value="${e.reminder??15}"></div></div><div class="actions"><button class="btn" onclick="saveEdit(${id||'null'})">Salvar</button><button class="btn ghost" onclick="closeModal()">Cancelar</button>${id?`<button class="btn danger" onclick="removeEvent(${id})">Excluir</button>`:''}</div>`;document.getElementById('modal').hidden=false}
function closeModal(){document.getElementById('modal').hidden=true}function saveEdit(id){let v=x=>document.getElementById(x).value,days=[...document.querySelectorAll('.weekday:checked')].map(x=>Number(x.value)),name=v('ename').trim(),date=v('edate');if(!name||minutes(v('end'))<=minutes(v('start'))||(!date&&!days.length)){alert('Preencha nome, horário válido e data ou dias de repetição.');return}let e={id:id||Date.now(),name,start:v('start'),end:v('end'),date:date||undefined,days:date?[]:days,cat:v('cat'),priority:Number(v('priority')),flex:v('flex')==='yes',reminder:Number(v('eventrem')),completed:[],skipped:[]};if(id){let old=state.events.find(x=>x.id===id);e.completed=old.completed||[];e.skipped=old.skipped||[];state.events=state.events.map(x=>x.id===id?e:x)}else state.events.push(e);save();closeModal();render()}function removeEvent(id){if(confirm('Excluir esta atividade e suas repetições?')){state.events=state.events.filter(e=>e.id!==id);save();closeModal();render()}}
function respond(t){chat.push({text:t,me:false});render()}function command(){let input=document.getElementById('cmd'),q=input.value.trim();if(!q)return;chat.push({text:q,me:true});let s=q.toLowerCase(),d=s.includes('amanhã')||s.includes('amanha')?plus(today(),1):today();if(/o que|agenda|compromissos|tenho hoje|tenho amanhã/.test(s)){respond(occurrences(d).map(e=>`${e.start} ${e.name}`).join('\n')||'Nenhuma atividade encontrada.');return}if(/não fiz|nao fiz|perdi|não consegui|nao consegui/.test(s)){let matches=occurrences(d).filter(e=>e.flex&&s.includes(e.name.toLowerCase().split(' ')[0]));if(!matches.length){respond('Não encontrei atividade flexível correspondente. Tente “não fiz estudo”.');return}suggest(matches[0]);return}let m=q.match(/(?:marcar|adicionar|agendar|criar)\s+(.+?)\s+(?:amanhã|amanha|hoje)?\s*(?:às|as)\s*(\d{1,2})(?::(\d{2}))?/i);if(m){let h=Number(m[2]),min=Number(m[3]||0);if(h>22||min>59){respond('Horário inválido.');return}let start=clock(h*60+min),end=clock(h*60+min+60);state.events.push({id:Date.now(),name:m[1].trim(),date:d,days:[],start,end,cat:'study',priority:2,flex:true,reminder:state.defaultReminder,completed:[],skipped:[]});save();respond(`Atividade adicionada em ${d} às ${start}. Duração padrão: 60 minutos. Edite na Agenda se necessário.`);return}respond('Não entendi. Tente “marcar leitura amanhã às 15:00”, “o que tenho hoje?” ou “não fiz estudo”.')}
function suggest(e){let dur=minutes(e.end)-minutes(e.start),day=e.day;for(let i=0;i<8;i++){let d=plus(day,i);for(let t=7*60;t+dur<=22*60;t+=15){if(d===day&&t<=minutes(e.start))continue;let occupied=occurrences(d).some(x=>x.id!==e.id&&t<minutes(x.end)&&t+dur>minutes(x.start));if(!occupied){proposal={e,d,start:clock(t),end:clock(t+dur)};respond(`Sugestão: mover “${e.name}” de ${day} para ${d}, ${clock(t)}–${clock(t+dur)}. Você aprova?`);return}}}respond('Não encontrei horário livre nos próximos 8 dias.')}function showProposal(){let el=document.getElementById('suggestion');if(el)el.innerHTML='<div class="notice">A mudança ainda não foi aplicada.</div><div class="actions"><button class="btn" onclick="approve()">Aprovar mudança</button><button class="btn ghost" onclick="proposal=null;respond(\'Mudança recusada.\')">Recusar</button></div>'}function approve(){let p=proposal;if(!p)return;let e=state.events.find(x=>x.id===p.e.id);if(!e)return;e.skipped??=[];if(!e.skipped.includes(p.e.day))e.skipped.push(p.e.day);state.events.push({...e,id:Date.now(),date:p.d,days:[],start:p.start,end:p.end,completed:[],skipped:[]});proposal=null;save();respond('Reagendamento aprovado e salvo.')}function listen(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){respond('Reconhecimento de voz indisponível neste navegador.');return}let r=new SR();r.lang='pt-BR';r.onresult=e=>{document.getElementById('cmd').value=e.results[0][0].transcript};r.start()}
function backup(){let a=document.createElement('a'),blob=new Blob([JSON.stringify({...state,routines:routineState},null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='minha-rotina-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}async function restore(inp){try{let obj=JSON.parse(await inp.files[0].text());if(!Array.isArray(obj.events))throw Error();if(confirm('Substituir a agenda atual pelo backup?')){state=obj;save();if(obj.routines&&Array.isArray(obj.routines.items)){routineState=obj.routines;saveRoutines()}render()}}catch{alert('Backup inválido.')}}let notified=new Set();setInterval(()=>{if(!('Notification'in window)||Notification.permission!=='granted')return;let now=new Date(),day=today(),m=now.getHours()*60+now.getMinutes();occurrences(day).forEach(e=>{let n=minutes(e.start)-(e.reminder??state.defaultReminder);let k=day+'-'+e.id;if(m===n&&!notified.has(k)){new Notification('Minha Rotina: '+e.name,{body:`Começa às ${e.start}`});notified.add(k)}})},30000);show('today');
</script></body></html>
